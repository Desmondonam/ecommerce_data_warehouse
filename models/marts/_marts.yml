version: 2

models:
  - name: fact_orders
    description: >
      Core fact table at order-item grain. One row per item within an order.
      Payment value is prorated to item level. Review score is from the most recent review.
    columns:
      - name: order_id
        tests:
          - not_null
          - relationships:
              to: ref('stg_orders')
              field: order_id
      - name: order_item_id
        tests:
          - not_null
      - name: customer_id
        tests:
          - not_null
          - relationships:
              to: ref('stg_customers')
              field: customer_id
      - name: seller_id
        tests:
          - not_null
          - relationships:
              to: ref('stg_sellers')
              field: seller_id
      - name: product_id
        tests:
          - not_null
          - relationships:
              to: ref('stg_products')
              field: product_id
      - name: customer_unique_id
        tests:
          - not_null
      - name: purchase_date
        tests:
          - not_null
      - name: item_price
        tests:
          - not_null
      - name: freight_value
        tests:
          - not_null
      - name: gross_revenue
        tests:
          - not_null
      - name: order_status
        tests:
          - not_null
          - accepted_values:
              values: [delivered, shipped, canceled, unavailable, invoiced, processing, created, approved]
      - name: review_score
        tests:
          - accepted_values:
              values: [1, 2, 3, 4, 5]
              config:
                where: "review_score is not null"

  - name: customer_lifetime_value
    description: >
      One row per unique customer (customer_unique_id). Aggregates spend, order frequency,
      delivery outcomes, and satisfaction across all orders for the same real person.
    columns:
      - name: customer_unique_id
        tests:
          - unique
          - not_null
      - name: total_orders
        tests:
          - not_null
      - name: total_gross_revenue
        tests:
          - not_null
      - name: first_order_date
        tests:
          - not_null
      - name: last_order_date
        tests:
          - not_null
      - name: customer_segment
        tests:
          - not_null
          - accepted_values:
              values: [one_time, occasional, loyal]

  - name: seller_performance
    description: >
      One row per seller. Summarises revenue, product breadth, delivery reliability,
      and customer satisfaction.
    columns:
      - name: seller_id
        tests:
          - unique
          - not_null
          - relationships:
              to: ref('stg_sellers')
              field: seller_id
      - name: total_orders
        tests:
          - not_null
      - name: total_revenue
        tests:
          - not_null
      - name: performance_tier
        tests:
          - not_null
          - accepted_values:
              values: [excellent, good, average, poor]

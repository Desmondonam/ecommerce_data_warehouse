version: 2

models:
  - name: stg_customers
    description: Cleaned customer records. Each row is one order-scoped customer_id.
    columns:
      - name: customer_id
        tests:
          - unique
          - not_null
      - name: customer_unique_id
        tests:
          - not_null
      - name: zip_code_prefix
        tests:
          - not_null
      - name: city
        tests:
          - not_null
      - name: state
        tests:
          - not_null

  - name: stg_sellers
    description: Cleaned seller records.
    columns:
      - name: seller_id
        tests:
          - unique
          - not_null
      - name: zip_code_prefix
        tests:
          - not_null
      - name: city
        tests:
          - not_null
      - name: state
        tests:
          - not_null

  - name: stg_products
    description: Cleaned product records with English category names joined in.
    columns:
      - name: product_id
        tests:
          - unique
          - not_null

  - name: stg_orders
    description: Cleaned orders with all timestamps cast to proper types.
    columns:
      - name: order_id
        tests:
          - unique
          - not_null
      - name: customer_id
        tests:
          - not_null
          - relationships:
              to: ref('stg_customers')
              field: customer_id
      - name: order_status
        tests:
          - not_null
          - accepted_values:
              values: [delivered, shipped, canceled, unavailable, invoiced, processing, created, approved]
      - name: purchased_at
        tests:
          - not_null

  - name: stg_order_items
    description: One row per item within an order. Grain = (order_id, order_item_id).
    columns:
      - name: order_id
        tests:
          - not_null
          - relationships:
              to: ref('stg_orders')
              field: order_id
      - name: order_item_id
        tests:
          - not_null
      - name: product_id
        tests:
          - not_null
          - relationships:
              to: ref('stg_products')
              field: product_id
      - name: seller_id
        tests:
          - not_null
          - relationships:
              to: ref('stg_sellers')
              field: seller_id
      - name: item_price
        tests:
          - not_null
      - name: freight_value
        tests:
          - not_null

  - name: stg_order_payments
    description: One row per payment instrument per order. An order can have multiple payment rows.
    columns:
      - name: order_id
        tests:
          - not_null
          - relationships:
              to: ref('stg_orders')
              field: order_id
      - name: payment_sequential
        tests:
          - not_null
      - name: payment_type
        tests:
          - not_null
          - accepted_values:
              values: [credit_card, boleto, voucher, debit_card, not_defined]
      - name: payment_value
        tests:
          - not_null

  - name: stg_order_reviews
    description: Customer reviews. An order may have multiple reviews; mart models take the latest.
    columns:
      - name: review_id
        tests:
          - not_null
          - unique:
              config:
                severity: warn
                # 789 review_ids are duplicated in the Olist source dataset.
                # fact_orders deduplicates via QUALIFY before joining.
      - name: order_id
        tests:
          - not_null
          - relationships:
              to: ref('stg_orders')
              field: order_id
      - name: review_score
        tests:
          - not_null
          - accepted_values:
              values: [1, 2, 3, 4, 5]

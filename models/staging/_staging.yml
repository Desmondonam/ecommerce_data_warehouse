version: 2

models:
  - name: stg_customers
    description: Cleaned customer records. Each row is one order-scoped customer_id.
    columns:
      - name: customer_id
        tests: [unique, not_null]
      - name: customer_unique_id
        tests: [not_null]
      - name: state
        tests: [not_null]

  - name: stg_sellers
    description: Cleaned seller records.
    columns:
      - name: seller_id
        tests: [unique, not_null]

  - name: stg_products
    description: Cleaned product records with English category names joined in.
    columns:
      - name: product_id
        tests: [unique, not_null]

  - name: stg_orders
    description: Cleaned orders with all timestamps cast to proper types.
    columns:
      - name: order_id
        tests: [unique, not_null]
      - name: customer_id
        tests: [not_null]
      - name: order_status
        tests:
          - not_null
          - accepted_values:
              values: [delivered, shipped, canceled, unavailable, invoiced, processing, created, approved]

  - name: stg_order_items
    description: One row per item within an order. Grain = (order_id, order_item_id).
    columns:
      - name: order_id
        tests: [not_null]
      - name: order_item_id
        tests: [not_null]
      - name: item_price
        tests: [not_null]
      - name: freight_value
        tests: [not_null]

  - name: stg_order_payments
    description: One row per payment instrument per order. An order can have multiple payment rows.
    columns:
      - name: order_id
        tests: [not_null]
      - name: payment_value
        tests: [not_null]

  - name: stg_order_reviews
    description: Customer reviews. An order may have multiple reviews; mart models take the latest.
    columns:
      - name: review_id
        tests: [unique, not_null]
      - name: order_id
        tests: [not_null]
      - name: review_score
        tests:
          - not_null
          - accepted_values:
              values: [1, 2, 3, 4, 5]

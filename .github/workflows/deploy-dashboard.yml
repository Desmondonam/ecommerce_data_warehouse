name: Deploy Evidence Dashboard

on:
  push:
    branches: [main]
    paths:
      - "dashboard/**"
      - "models/**"
      - ".github/workflows/deploy-dashboard.yml"
  workflow_dispatch:

permissions:
  contents: write

jobs:
  build-and-deploy:
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: dashboard

    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"

      - name: Install dbt-duckdb
        run: pip install dbt-duckdb

      - name: Load raw CSV data into DuckDB
        working-directory: .
        run: python scripts/load_raw_data.py

      - name: Run dbt to build mart tables
        working-directory: .
        run: dbt run --profiles-dir .

      - uses: actions/setup-node@v4
        with:
          node-version: 20
          cache: npm
          cache-dependency-path: dashboard/package-lock.json

      - name: Install Evidence dependencies
        run: npm ci

      - name: Build data sources
        run: npm run sources
        env:
          EVIDENCE_SOURCE__WAREHOUSE__FILENAME: ../warehouse.duckdb

      - name: Build static site
        run: npm run build
        env:
          EVIDENCE_SOURCE__WAREHOUSE__FILENAME: ../warehouse.duckdb

      - name: Deploy to GitHub Pages
        uses: peaceiris/actions-gh-pages@v4
        with:
          github_token: ${{ secrets.GITHUB_TOKEN }}
          publish_dir: dashboard/build
          publish_branch: gh-pages
